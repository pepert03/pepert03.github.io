<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">LLM fine-tuning challenge pipeline</title>
  <desc id="desc">One LLM, one GPU, one day of training: base models are fine-tuned with LoRA and SFT, then evaluated with IFEval.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c4c4"/><stop offset="1" stop-color="#f2b880"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#212529"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #212529; stroke-width: 3; }
      .line { fill: none; stroke: #212529; stroke-width: 3; marker-end: url(#arrow); }
      .title { fill: #212529; font-family: "Computer Modern Serif", "Latin Modern Roman", "CMU Serif", Georgia, serif; font-size: 42px; font-weight: 700; text-anchor: middle; }
      .label { fill: #212529; font-family: "Computer Modern Serif", "Latin Modern Roman", "CMU Serif", Georgia, serif; font-size: 29px; text-anchor: middle; }
      .small { fill: #495057; font-family: "Computer Modern Serif", "Latin Modern Roman", "CMU Serif", Georgia, serif; font-size: 21px; text-anchor: middle; }
      .badge { fill: #ffffff; stroke: url(#accent); stroke-width: 4; }
    </style>
  </defs>
  <text class="title" x="500" y="76">LLM Fine-Tuning Challenge</text>

  <rect class="badge" x="130" y="145" width="210" height="78" rx="39"/>
  <rect class="badge" x="395" y="145" width="210" height="78" rx="39"/>
  <rect class="badge" x="660" y="145" width="210" height="78" rx="39"/>
  <text class="label" x="235" y="193">1 LLM</text>
  <text class="label" x="500" y="193">1 GPU</text>
  <text class="label" x="765" y="193">1 Day</text>

  <rect class="box" x="120" y="300" width="760" height="125" rx="20"/>
  <text class="label" x="500" y="350">Base language models</text>
  <text class="small" x="500" y="383">Llama · Mistral · Qwen · Granite</text>
  <path class="line" d="M500 415 V495"/>

  <rect class="box" x="120" y="495" width="760" height="125" rx="20"/>
  <text class="label" x="500" y="545">Efficient adaptation</text>
  <text class="small" x="500" y="580">LoRA + supervised fine-tuning (SFT)</text>
  <path class="line" d="M500 620 V700"/>

  <rect class="box" x="120" y="700" width="760" height="125" rx="20"/>
  <text class="label" x="500" y="747">Evaluation</text>
  <text class="small" x="500" y="780">IFEval instruction-following benchmark</text>

  <circle cx="112" cy="350" r="42" fill="#58c4c4"/>
  <text class="label" x="112" y="361" font-size="30">01</text>
  <circle cx="112" cy="558" r="42" fill="#79a9d1"/>
  <text class="label" x="112" y="569" font-size="30">02</text>
  <circle cx="112" cy="757" r="42" fill="#f2b880"/>
  <text class="label" x="112" y="768" font-size="30">03</text>
</svg>
